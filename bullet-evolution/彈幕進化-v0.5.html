 {const bs=(li,k=0)=>POPS[li].g.slice().sort((a,b)=>(b.sc||0)-(a.sc||0))[k];if(WAVE%10===0||FB===3)q.push({t:3,tier:3,boss:[bs(ids[0]),bs(ids[1]),bs(ids[2]||ids[0])],x:0,y:.2});else if(WAVE%5===0||FB===2)q.push({t:3,tier:2,boss:[bs(ids[0]),bs(ids[1])],x:0,y:.2});else if(WAVE%3===0||FB===1)q.push({t:3,tier:1,boss:[bs(ids[0]),bs(ids[0],1)],x:0,y:.2});FB=0}q.sort((a,b)=>a.t-b.t);return{tot:q.length,t:0,q,E:[],eb:[],pb:[],lz:[],px:0,py:PYB,hit:0,kill:0,inv:0,ids,end:0,dn:[]}}
